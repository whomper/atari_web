; troll-proxy, SMTP part: plain SMTP from TROLL on port 1025, STARTTLS to
; iCloud on 587. TROLL's IMAP goes through falcon_imap_logproxy.py on 1143.
; Installed by install_falcon_proxy.sh as /etc/stunnel/troll-smtp.conf.
; The standard ports (143, 587) belong to mail-proxy for MAIL.PRG
; (whomper/mail, gateway/install.sh).
pid = /run/stunnel-troll-smtp.pid
setuid = stunnel4
setgid = stunnel4
sslVersionMin = TLSv1.2
verifyChain = yes
CAfile = /etc/ssl/certs/ca-certificates.crt

[troll-smtp]
client = yes
accept = 0.0.0.0:1025
connect = smtp.mail.me.com:587
protocol = smtp
checkHost = smtp.mail.me.com
